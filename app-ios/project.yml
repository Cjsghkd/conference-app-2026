name: KaigiApp
options:
  bundleIdPrefix: io.github.droidkaigi.confsched
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  # Generated by :app-ios-kotlin's swiftPMDependencies. The exported Kotlin code loads this
  # package's dynamic product, KotlinMultiplatformLinkedPackageDylib, which Xcode embeds in the app
  # bundle only when the target links the package.
  KotlinMultiplatformLinkedPackage:
    path: KotlinMultiplatformLinkedPackage
targets:
  KaigiApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    dependencies:
      - package: KotlinMultiplatformLinkedPackage
        product: KotlinMultiplatformLinkedPackage
    info:
      path: KaigiApp-Info.plist
      properties:
        CFBundleDisplayName: DroidKaigi 2026
        # Required by Compose Multiplatform's PlistSanityCheck (it throws on launch otherwise).
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    preBuildScripts:
      - name: Embed Kotlin Swift Export Library
        # Gradle runs a nested xcodebuild for the generated Swift package, and that build reads the
        # inherited SWIFT_INCLUDE_PATHS; leaving it set makes the already-copied module maps in
        # BUILT_PRODUCTS_DIR collide with the ones the nested build is compiling.
        script: cd "$SRCROOT/.." && env -u SWIFT_INCLUDE_PATHS ./gradlew :app-ios-kotlin:embedSwiftExportForXcode
        basedOnDependencyAnalysis: false
      # Gradle never resolves Swift packages, so the licenses screen learns about them from the
      # iOS build; the app reads the result and hands it to KaigiAppHost.
      - name: Generate Swift Package Licenses
        script: "$SRCROOT/scripts/generate-swift-package-licenses.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.droidkaigi.confsched.kaigiapp
        GENERATE_INFOPLIST_FILE: NO
        # embedSwiftExportForXcode drops the .swiftmodule directories, the bridge module maps and
        # the static library into BUILT_PRODUCTS_DIR; the module maps sit one directory deep, hence
        # the recursive import path.
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(BUILT_PRODUCTS_DIR)/**
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(BUILT_PRODUCTS_DIR)
        OTHER_LDFLAGS:
          - $(inherited)
          - -lAppShared
        # The Gradle embed task writes into the build products; sandboxing breaks it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
