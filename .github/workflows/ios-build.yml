name: iOS build

on:
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.swift'
      - '**/*.toml'
      - 'app-ios/**'
      - 'gradle/wrapper/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.swift'
      - '**/*.toml'
      - 'app-ios/**'
      - 'gradle/wrapper/**'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Drives the whole iOS build the way a developer does: Xcode's pre-build script runs Gradle's
  # Swift Export, and Xcode then compiles the generated Swift, links it and packages the app. A
  # Gradle-only check would cover neither the generated Swift sources nor the real build settings.
  # Kotlin/Native needs an Apple host to compile Apple targets, hence macos-latest instead of ubuntu.
  xcodebuild:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # The root tab bar's Liquid Glass path compiles against the iOS 26 SDK, which the runner
      # image's default Xcode may predate.
      - name: Select the newest installed Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select --switch "$newest/Contents/Developer"; fi
          xcodebuild -version
      # A generic/platform=iOS Simulator destination resolves to x86_64, which no Kotlin target is
      # configured for; naming one of the runner's own simulators pins the build to arm64.
      - name: Resolve an iOS Simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json |
            jq -r '[.devices | to_entries[]
                    | select(.key | contains("SimRuntime.iOS"))
                    | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = null ]; then
            echo "No iPhone simulator is available on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # SWIFT_INCLUDE_PATHS is deliberately left unset here: Xcode exports it to the pre-build
      # script, which unsets it again for the nested Gradle build, and a value inherited from the
      # environment would reach that build through a path the script does not cover.
      - name: Build the iOS app
        run: |
          xcodebuild build \
            -project app-ios/KaigiApp.xcodeproj \
            -scheme KaigiApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
