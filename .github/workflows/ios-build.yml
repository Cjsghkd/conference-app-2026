name: iOS build

on:
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.toml'
      - 'gradle/wrapper/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.toml'
      - 'gradle/wrapper/**'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Links app-shared's iOS framework, which aggregates every KMP module's iosSimulatorArm64 target.
  # Kotlin/Native needs an Apple host to link Apple targets, hence macos-latest instead of ubuntu.
  link-framework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Link iOS framework
        run: ./gradlew :app-shared:linkDebugFrameworkIosSimulatorArm64
