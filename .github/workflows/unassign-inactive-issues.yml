name: Unassign inactive issues

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours at UTC 0:00, 6:00, 12:00, 18:00 (JST 9:00, 15:00, 21:00, 3:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'When true, log intended actions without posting comments or unassigning'
        type: boolean
        default: true

permissions:
  issues: write
  pull-requests: read

jobs:
  unassign-inactive-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const PRIORITY_DAYS = [
              { label: 'priority:high 🔥', remind: 2, unassign: 3 },
              { label: 'priority:medium ⏳', remind: 3, unassign: 5 },
              { label: 'priority:low 🐢', remind: 5, unassign: 7 },
            ]
            const MS_PER_DAY = 24 * 60 * 60 * 1000

            function thresholdsFor(issue) {
              const names = new Set(
                (issue.labels ?? []).map((label) => (typeof label === 'string' ? label : label.name))
              )
              const matched = PRIORITY_DAYS.filter((tier) => names.has(tier.label))
              // Issues awaiting triage carry no priority label; they must not idle on a looser
              // schedule than triaged ones, so unlabeled (and conflicting) issues take the
              // strictest matching tier.
              if (matched.length === 0) return PRIORITY_DAYS[0]
              return matched.reduce((a, b) => (a.unassign <= b.unassign ? a : b))
            }

            const input = context.payload.inputs?.dry_run
            const dryRun = context.eventName === 'workflow_dispatch'
              ? input !== false && input !== 'false'
              : false
            core.info(`dry_run=${dryRun}`)

            const { owner, repo } = context.repo
            const now = Date.now()

            const reminderMarker = (login) => `<!-- stale-reminder:${login} -->`

            async function openLinkedPullRequestAuthors(timeline) {
              const prNumbers = new Set()
              for (const event of timeline) {
                if (
                  event.event === 'cross-referenced' &&
                  event.source?.issue?.pull_request &&
                  event.source.issue.repository?.full_name === `${owner}/${repo}`
                ) {
                  prNumbers.add(event.source.issue.number)
                }
              }

              const authors = new Set()
              for (const prNumber of prNumbers) {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber })
                if (pr.state === 'open' && pr.user?.login) {
                  authors.add(pr.user.login)
                }
              }
              return authors
            }

            function lastAssignedAt(timeline, login) {
              const assignedEvents = timeline
                .filter((event) => event.event === 'assigned' && event.assignee?.login === login)
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
              return assignedEvents.length > 0
                ? new Date(assignedEvents[assignedEvents.length - 1].created_at)
                : null
            }

            function lastCommentAt(comments, login) {
              const own = comments
                .filter((comment) => comment.user?.login === login)
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
              return own.length > 0 ? new Date(own[own.length - 1].created_at) : null
            }

            function alreadyReminded(comments, login, lastActivity) {
              const marker = reminderMarker(login)
              return comments.some(
                (comment) => comment.body?.includes(marker) && new Date(comment.created_at) > lastActivity
              )
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              assignee: '*',
              per_page: 100,
            })

            for (const issue of issues) {
              if (issue.pull_request) continue
              if (!issue.assignees || issue.assignees.length === 0) continue

              const { remind: remindAfterDays, unassign: unassignAfterDays } = thresholdsFor(issue)

              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              })

              const linkedPrAuthors = await openLinkedPullRequestAuthors(timeline)

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              })

              for (const assignee of issue.assignees) {
                const login = assignee.login
                if (linkedPrAuthors.has(login)) {
                  core.info(`#${issue.number}: ${login} has an open linked pull request, skipping`)
                  continue
                }
                // An assignment can land long after the comment that requested it, so take whichever is later.
                const lastActivity = new Date(
                  Math.max(
                    lastCommentAt(comments, login)?.getTime() ?? 0,
                    lastAssignedAt(timeline, login)?.getTime() ?? 0,
                    new Date(issue.created_at).getTime()
                  )
                )
                const daysSince = (now - lastActivity.getTime()) / MS_PER_DAY

                if (daysSince >= unassignAfterDays) {
                  core.info(`#${issue.number}: unassigning ${login} (idle ${daysSince.toFixed(1)}d, threshold ${unassignAfterDays}d)`)
                  if (!dryRun) {
                    await github.rest.issues.removeAssignees({
                      owner,
                      repo,
                      issue_number: issue.number,
                      assignees: [login],
                    })
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: `@${login} This issue has been inactive for ${unassignAfterDays}+ days, so the assignment has been removed. Please reassign yourself if you'd like to continue working on it.`,
                    })
                  }
                } else if (daysSince >= remindAfterDays) {
                  if (alreadyReminded(comments, login, lastActivity)) {
                    core.info(`#${issue.number}: ${login} already reminded, skipping`)
                    continue
                  }
                  core.info(`#${issue.number}: reminding ${login} (idle ${daysSince.toFixed(1)}d, threshold ${remindAfterDays}d)`)
                  if (!dryRun) {
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: `@${login} This issue has had no activity for ${remindAfterDays} days. If you're still working on it, please leave a comment (opening a draft pull request also counts). Otherwise, the assignment will be removed after ${unassignAfterDays} days of inactivity.\n${reminderMarker(login)}`,
                    })
                  }
                }
              }
            }
