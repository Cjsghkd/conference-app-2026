org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official

# Compose Multiplatform needs this for resource handling / compatibility.
org.jetbrains.compose.experimental.jscanvas.enabled=true

# Android (AGP) — required once an Android target is on the build (the :app-android app + the
# androidLibrary targets of :core / :feature:* / :app-shared all pull in AndroidX artifacts).
android.useAndroidX=true
